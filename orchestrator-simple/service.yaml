apiVersion: apps/v1
kind: Deployment
metadata:
  name: service_name
  labels:
    app: service_name
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service_name
  template:
    metadata:
      labels:
        app: service_name
    spec:
      # Works around a real bug found while testing against a live cluster:
      # glibc's getaddrinfo() issues parallel A/AAAA queries by default, and
      # on this environment's networking that races on a shared socket and
      # fails with "OSError: [Errno 16] Device or resource busy" - silently
      # breaking every hostname-based connection for any Python/glibc-based
      # process (confirmed via the init container's aws-cli failing while
      # simpler tools like busybox's wget/nslookup, which don't hit the same
      # glibc code path, worked fine). single-request forces sequential
      # queries instead, avoiding the race entirely.
      dnsConfig:
        options:
          - name: single-request
      # No Kubernetes API access needed inside a project's own pod - it only
      # ever talks to S3/R2 and this pod's own filesystem/terminal.
      automountServiceAccountToken: false
      securityContext:
        # The init container below uses these as-is. The runner container
        # overrides runAsNonRoot/runAsUser/runAsGroup with its own - see the
        # comment on its own securityContext for why - but inherits fsGroup.
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        # Owns the emptyDir volume below, so every uid that ends up touching
        # it (1000 here, but also the runner container's 0 and every
        # terminal session's 1001 - see their own securityContext/env
        # comments) can read/write it via shared group membership.
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: workspace-volume
          emptyDir:
            sizeLimit: workspace_storage_limit_placeholder
      initContainers:
        - name: copy-s3-resources
          # Pinned (not :latest) so a new push to this image can't silently
          # change what runs in every project pod's init container.
          image: amazon/aws-cli:2.38.2
          # Uses the pod-level securityContext's uid/gid (1000) - the files
          # it writes into /workspace end up group-owned by fsGroup 1000,
          # which both the runner container (gid 1000, see below) and every
          # terminal session (SANDBOX_SHELL_GID=1000, see below) share, so
          # they can still read/write them despite none of those three
          # running as this same uid.
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          command: ["/bin/sh", "-c"]
          args:
            # --endpoint-url is conditional (${S3_ENDPOINT:+...}) so this
            # still works unmodified against real AWS S3 (leave S3_ENDPOINT
            # blank below) as well as R2/MinIO/any S3-compatible endpoint -
            # found by actually testing against MinIO, where this container
            # would otherwise have tried to reach real AWS and failed.
            - >
              aws s3 cp s3://your-bucket-name/code/service_name/ /workspace/ --recursive ${S3_ENDPOINT:+--endpoint-url "$S3_ENDPOINT"} &&
              echo "Resources copied from S3";
          env:
            # aws_credentials_secret_placeholder is substituted at /start time
            # to either "sandbox-secrets" (bucket-wide, legacy fallback) or
            # the per-project STS-scoped secret - see orchestrator-simple's
            # sts.ts/index.ts. AWS_SESSION_TOKEN is optional because the
            # legacy secret doesn't have one.
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws_credentials_secret_placeholder
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws_credentials_secret_placeholder
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_SESSION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: aws_credentials_secret_placeholder
                  key: AWS_SESSION_TOKEN
                  optional: true
            - name: S3_ENDPOINT
              value: "your-s3-endpoint" # leave blank for real AWS S3; set for R2/MinIO/etc - must match the runner container's S3_ENDPOINT below
          volumeMounts:
            - name: workspace-volume
              mountPath: /workspace
          resources:
            requests:
              ephemeral-storage: workspace_storage_request_placeholder
            limits:
              ephemeral-storage: workspace_storage_limit_placeholder
      containers:
        - name: runner
          image: ghcr.io/shauryaasharma/runner:latest
          # Overrides the pod-level securityContext above (which still
          # covers the init container) - this process briefly needs real
          # root (uid 0) to setuid/setgid the user's terminal down to a
          # *different*, lower-privileged uid (1001, see SHELL_UID below)
          # than its own. Every other capability is dropped, including
          # CAP_SYS_PTRACE and CAP_DAC_OVERRIDE/CAP_DAC_READ_SEARCH - so
          # this uid-0 process gets no DAC bypass (file permissions still
          # apply to it exactly as they would to any uid, via its gid 1000
          # matching fsGroup) and can't ptrace or read another uid's
          # /proc/<pid>/environ, closing the gap where the user's own
          # shell (now a different uid) could previously read this
          # process's secrets that way. Permitted under this namespace's
          # "baseline" Pod Security Admission label (see namespace.ts) -
          # SETUID/SETGID are on baseline's allowed-capabilities list, and
          # baseline (unlike "restricted") has no non-root requirement.
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["SETUID", "SETGID"]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 3001
            - containerPort: 3000
          env:
            # The uid/gid every terminal session (including autorun) is
            # spawned as - see runner/src/pty.ts. gid matches the pod's
            # fsGroup (1000) so /workspace stays accessible by group
            # permission; uid is deliberately its own, distinct from both
            # this container's uid (0, above) and the init container's
            # (1000) - see the securityContext comment above for why.
            - name: SANDBOX_SHELL_UID
              value: "1001"
            - name: SANDBOX_SHELL_GID
              value: "1000"
            - name: REPL_ID
              value: service_name
            - name: OWNER_ID
              value: owner_id_placeholder
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws_credentials_secret_placeholder
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws_credentials_secret_placeholder
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_SESSION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: aws_credentials_secret_placeholder
                  key: AWS_SESSION_TOKEN
                  optional: true
            - name: JWT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: sandbox-secrets
                  key: JWT_PUBLIC_KEY
            # Only present in sandbox-secrets while a key rotation is in
            # progress (see README "Rotating JWT keys") - optional so the
            # pod still starts the rest of the time.
            - name: JWT_PUBLIC_KEY_PREVIOUS
              valueFrom:
                secretKeyRef:
                  name: sandbox-secrets
                  key: JWT_PUBLIC_KEY_PREVIOUS
                  optional: true
            # Per-project token, HMAC-derived from a master key orchestrator-simple
            # alone holds (see src/internalToken.ts) - written fresh into its own
            # Secret at /start time, not copied from sandbox-secrets like the
            # keys above.
            - name: INTERNAL_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sandbox-internal-token
                  key: INTERNAL_API_TOKEN
            # Every project's Socket.IO/HTTP origin check must allow the one
            # configured frontend origin, not a per-project value - these are
            # substituted from orchestrator-simple's own ALLOWED_ORIGINS/
            # NODE_ENV (see corsOrigins.ts/index.ts), the same source of truth
            # its own CORS check uses.
            - name: ALLOWED_ORIGINS
              value: "allowed_origins_placeholder"
            - name: NODE_ENV
              value: "node_env_placeholder"
            - name: S3_BUCKET
              value: "your-bucket-name"
            - name: S3_ENDPOINT
              value: "your-s3-endpoint"
          volumeMounts:
            - name: workspace-volume
              mountPath: /workspace
          resources:
            # Lowered from 1 CPU/1Gi to fit on a free-tier Micro node (956Mi
            # total RAM, shared with k3s itself + ingress-nginx) - found by
            # actually trying to schedule a pod here and hitting "Insufficient
            # memory" since the original 1Gi request alone exceeded the
            # node's entire capacity. Raise this back up once running on
            # real Ampere/bigger-node capacity.
            requests:
              cpu: "100m"
              memory: "256Mi"
              ephemeral-storage: workspace_storage_request_placeholder
            limits:
              cpu: "500m"
              memory: "400Mi"
              ephemeral-storage: workspace_storage_limit_placeholder

---
apiVersion: v1
kind: Service
metadata:
  name: service_name
spec:
  selector:
    app: service_name
  ports:
    - protocol: TCP
      name: ws
      port: 3001
      targetPort: 3001
    - protocol: TCP
      name: user
      port: 3000
      targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: service_name
  # annotations:
  #   Uncomment once TLS is set up (see README "TLS via cert-manager") to
  #   force HTTP -> HTTPS. Leave commented out until then, or this breaks
  #   plain-HTTP access before a certificate actually exists.
  #   nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  # No tls: block needed here - TLS for every project's subdomain is served
  # via the ingress controller's cluster-wide default certificate (see
  # k8s/ingress-controller.yaml and README "TLS via cert-manager"), not a
  # per-project certificate. This avoids issuing (and rate-limiting against)
  # a brand new Let's Encrypt cert every time a project starts.
  rules:
  - host: service_name.ws_domain_placeholder
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: service_name
            port:
              number: 3001
  - host: service_name.app_domain_placeholder
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: service_name
            port:
              number: 3000
---
# NOTE: NetworkPolicy objects are only enforced if your cluster's CNI plugin
# supports it (Calico, Cilium, Weave Net, etc.) - plain flannel does NOT
# enforce these rules; they get created but silently ignored. If you're on
# flannel, switch to Canal (flannel + Calico's policy engine) or a
# policy-enforcing CNI, or this whole block is a no-op.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: service_name
spec:
  podSelector:
    matchLabels:
      app: service_name
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Only the ingress controller may reach this pod's ws (3001) and user-app
    # (3000) ports - blocks every other pod, including other projects', from
    # connecting directly. Adjust the namespace label if your ingress
    # controller isn't in "ingress-nginx" (see k8s/ingress-controller.yaml,
    # which installs it there).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3001
        - protocol: TCP
          port: 3000
  egress:
    # DNS - needed to resolve S3/R2 endpoints and package registries (npm/pip).
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Everything else EXCEPT the cluster's own internal ranges, the cloud
    # metadata endpoint, and the RFC1918 private ranges. This is what stops
    # one project's pod from reaching another project's pod, the Kubernetes
    # API server, the cloud provider's instance-metadata service (a classic
    # SSRF-to-credential-theft target - AWS/GCP/Azure all serve it at
    # 169.254.169.254), or anything else on the cluster's private network -
    # while still allowing npm/pip installs and S3/R2 access out to the open
    # internet. pod_cidr_placeholder/service_cidr_placeholder are substituted
    # at /start time from orchestrator-simple's POD_CIDR/SERVICE_CIDR env
    # vars instead of being hardcoded kubeadm defaults - confirm your
    # cluster's actual values:
    #   pod CIDR:     kubectl cluster-info dump | grep -m1 cluster-cidr
    #   service CIDR: check your provider's docs (EKS/GKE/AKS/k3s all default
    #                 to different ranges); the API server's ClusterIP
    #                 (`kubectl get svc kubernetes`) falls inside it.
    # NOTE: this is IP/CIDR-level only - it does not restrict *which*
    # internet hosts a pod can reach (any public IP is still allowed, e.g.
    # for npm/pip/S3). An FQDN allowlist (only npm/pip/S3's actual hostnames)
    # needs a CNI with FQDN-based NetworkPolicy support (e.g. Cilium) or an
    # egress proxy - not implemented in this repo, see README "Network policy".
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.169.254/32 # cloud metadata endpoint (AWS/GCP/Azure)
              - 10.0.0.0/8 # RFC1918
              - 172.16.0.0/12 # RFC1918
              - 192.168.0.0/16 # RFC1918
              - pod_cidr_placeholder
              - service_cidr_placeholder
